
<!DOCTYPE html>
<html>
<head>
    <title>Lakshmi Poojitha - Student Profile</title>

    <style>

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Body */
        body {
            background-color: #f5f2ff;
            font-family: Arial;
        }

        /* Profile Card */
        .profile-card {
            width: 350px;
            height: 400px;
            background-color: white;
            margin: 80px auto;
            padding: 15px;
            text-align: center;

            box-shadow:
                -10px 10px 25px 5px rgba(150, 50, 255, 0.5),
                10px 10px 25px 5px rgba(255, 120, 80, 0.5);
        }

        /* Profile Image */
        .profile-image {
            width: 80px;
            height: 80px;
            background-color: lightblue;
            border-radius: 50%;
            margin: 5px auto 10px auto;
            padding-top: 15px;
            font-size: 40px;
        }

        /* Main Heading */
        h1 {
            font-family: Georgia;
            font-size: 24px;
            font-weight: bold;
            color: black;
            text-decoration: underline;
            text-decoration-color: blueviolet;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            line-height: 1;
            margin: 8px 0;
        }

        /* Student Name */
        h2 {
            font-family: Georgia;
            font-size: 18px;
            font-weight: bold;
            color: darkblue;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
        }

        /* Description */
        p {
            font-family: Arial;
            font-size: 13px;
            font-style: italic;
            color: black;
            text-align: center;
            word-spacing: 2px;
            line-height: 1.4;
            margin: 8px 0;
        }

        /* Horizontal Line */
        hr {
            margin: 10px 0;
        }

        /* Skills Heading */
        h3 {
            font-family: Georgia;
            font-size: 20px;
            font-weight: bold;
            color: black;
            letter-spacing: 3px;
            margin: 10px 0;
        }

        /* Skills */
        .skills {
            font-family: Arial;
            font-size: 13px;
            font-style: normal;
            font-weight: bold;
            color: darkblue;
            word-spacing: 3px;
            line-height: 1.5;
            margin: 8px 0;
        }

    </style>
</head>

<body>

    <div class="profile-card">

        <div class="profile-image">
            👩🏻‍💻
        </div>

        <h1>
            STUDENT<br>PROFILE
        </h1>

        <h2>AKKULA LAKSHMI POOJITHA</h2>

        <p>
            AI & Data Science Graduate.
            Passionate about Python,
            technology and web development.
        </p>

        <hr>

        <h3>Skills:</h3>

        <p class="skills">
            Python &nbsp; • &nbsp;
            SQL &nbsp; • &nbsp;
            HTML &nbsp; <br>
            CSS &nbsp; • &nbsp;
            JavaScript
        </p>

    </div>

</body>
</html>
